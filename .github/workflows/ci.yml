name: LoanLens CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore LoanLens.sln

    - name: Build Solution
      run: dotnet build LoanLens.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test tests/LoanLens.Domain.Tests/LoanLens.Domain.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
